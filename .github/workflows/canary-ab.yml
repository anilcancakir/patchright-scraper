# Temporary: runs scripts/canary.sh against published images to tell a Chrome 157
# regression from an older problem. Removed again before this branch merges.
name: canary-ab

on:
  pull_request:
    paths:
      - .github/workflows/canary-ab.yml

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - anilcancakir/patchright-scraper:v0.6.18
          - anilcancakir/patchright-scraper:v0.6.19
          - anilcancakir/patchright-scraper:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Canary
        env:
          IMAGE: ${{ matrix.image }}
        run: bash scripts/canary.sh "$IMAGE"
